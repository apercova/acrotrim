[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "acrotrim"
version = "0.1.0"
description = "Deterministic name prefix and suffix cleanup"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
acrotrim = "acrotrim.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "build>=1.6.1",
    "pytest>=9.1.1",
]
